<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07050c">
<title>White Rabbit Lounge</title>
<link rel="icon" type="image/png" href="img/kodi.png">
<link rel="preload" href="fonts/pirata-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="is-locked">

<section id="login" class="login" aria-labelledby="login-title">
  <div class="login__glow" aria-hidden="true"></div>
  <form id="login-form" class="login__card" autocomplete="on" novalidate>
    <img class="login__logo" src="img/logo.png" alt="White Rabbit Lounge">
    <h1 id="login-title" class="neon-title">Mitglieder Login</h1>
    <label class="field">
      <span>Benutzername</span>
      <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </label>
    <label class="field">
      <span>Passwort</span>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
    </label>
    <label class="check">
      <input id="login-keep" type="checkbox">
      <span>Angemeldet bleiben</span>
    </label>
    <button id="login-btn" class="btn btn--neon" type="submit">Anmelden</button>
    <p id="login-msg" class="login__msg" role="alert" aria-live="polite"></p>
  </form>
</section>

<div id="app" class="app" hidden>
  <header class="topbar">
    <a class="topbar__brand" href="#/start" aria-label="Startseite">
      <img src="img/logo.png" alt="White Rabbit Lounge">
    </a>
    <button id="nav-toggle" class="topbar__toggle" type="button" aria-controls="nav" aria-expanded="false" aria-label="Menü">
      <span></span><span></span><span></span>
    </button>
    <nav id="nav" class="topbar__nav"></nav>
    <button id="logout" class="topbar__logout" type="button" title="Abmelden" aria-label="Abmelden">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l1.4-1.4L8.8 13H20v-2H8.8l2.6-2.6L10 7l-5 5 5 5zM4 5h8V3H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8v-2H4V5z"/></svg>
    </button>
  </header>

  <main id="page" class="page" tabindex="-1"></main>

  <footer class="footer">
    <img class="footer__kodi" src="img/kodi.png" alt="Kodi">
    <div id="footer-social" class="social"></div>
    <p id="footer-copy" class="footer__copy"></p>
  </footer>
</div>

<div id="lightbox" class="lightbox" hidden>
  <button class="lightbox__close" type="button" aria-label="Schließen">&times;</button>
  <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Zurück">&#8249;</button>
  <figure>
    <img alt="">
    <figcaption></figcaption>
  </figure>
  <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Weiter">&#8250;</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
